# Screenshots of a demo group for the presentation video (tools/video). Runs by hand or when the app or
# the demo scripts change on a video/* branch; the shots come out as the "video-shots" artifact.
name: Video shots

on:
  workflow_dispatch:
  push:
    branches: ["video/**"]
    paths: ["tools/video/demo/**", ".github/workflows/video-shots.yml", "src/**"]

# Pushes the shots to the video-shots branch (an orphan branch with only the latest run), so they can be fetched with git.
permissions:
  contents: write

jobs:
  shots:
    name: Demo group screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      APP_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      # Fake Gemini started by tools/video/demo/run.sh: no real key is ever used.
      GEMINI_API_KEY: test-key
      GEMINI_API_URL: http://127.0.0.1:54400
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/video/package-lock.json
      # Pinned: CLI 3.0.0 (02/11/2026) rejects [inbucket] in supabase/config.toml. Upgrade on purpose, not by `latest`.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Start local Supabase (applies supabase/migrations)
        run: supabase start -x realtime,studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta

      - name: Export local Supabase URL and keys
        run: |
          eval "$(supabase status -o env)"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Build the app
        run: |
          npm ci
          npm run build

      - name: Install the capture dependencies and Chromium
        working-directory: tools/video
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start the app
        run: |
          nohup npx next start -p 3000 > next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/login && exit 0; sleep 1; done
          cat next.log; exit 1

      - name: Demo group and screenshots
        run: bash tools/video/demo/run.sh 2>&1 | tee tools/video/demo/out-capture.log; exit ${PIPESTATUS[0]}

      - name: Upload the shots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-shots
          path: |
            tools/video/demo/out/
            tools/video/demo/gemini_mock.log
            next.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish the shots to the video-shots branch
        if: always()
        run: |
          mkdir -p /tmp/pub && cp -r tools/video/demo/out/. /tmp/pub/ 2>/dev/null || true
          cp tools/video/demo/out-capture.log tools/video/demo/gemini_mock.log next.log /tmp/pub/ 2>/dev/null || true
          cd /tmp/pub
          git init -q -b video-shots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Video shots from run ${{ github.run_id }} (${{ github.sha }})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" video-shots
